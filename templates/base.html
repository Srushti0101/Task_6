<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .navbar { background: rgba(255,255,255,.12); backdrop-filter: blur(10px); }
    .glass-card { background: #fff; border: 0; border-radius: 1.25rem;
                  box-shadow: 0 15px 35px rgba(0,0,0,.2); }
    .task-card { transition: transform .2s; border-left: 6px solid #ccc; }
    .task-card:hover { transform: translateY(-4px); }
    .prio-high { border-left-color: #dc3545; }
    .prio-medium { border-left-color: #ffc107; }
    .prio-low { border-left-color: #198754; }
    .btn-gradient { background: linear-gradient(135deg, #667eea, #764ba2);
                    color: #fff; border: 0; }
    .btn-gradient:hover { color: #fff; opacity: .9; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'task_list' %}">
        <i class="bi bi-check2-square"></i> TaskFlow
      </a>
      <a class="btn btn-light btn-sm" href="{% url 'task_create' %}">
        <i class="bi bi-plus-lg"></i> New Task
      </a>
    </div>
  </nav>

  <div class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
